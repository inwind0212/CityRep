[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-benchmark"
version = "0.1.0"
description = "Evaluation-only CityRep runner for user-provided urban embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "geopandas",
  "h3",
  "numpy",
  "pandas",
  "pyarrow",
  "pyproj",
  "rasterio",
  "scikit-learn",
  "shapely",
  "scipy",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
urban-benchmark = "urban_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["urban_benchmark*"]
